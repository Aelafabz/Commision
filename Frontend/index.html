<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commission Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Commission Export Control</h1>
        
        <form id="export-form" class="form">
          <label>
            From date
            <input id="fromDate" type="date" required />
          </label>
          <label>
            To date
            <input id="toDate" type="date" required />
          </label>
          <label>
            Physicians
            <input id="physicians" type="text" placeholder="Dr. Ahmed, Dr. Sara" />
          </label>
          <button id="submit-btn" type="submit">Start export</button>
        </form>

        <p id="status" class="status"></p>

        <h3>Recent export log</h3>
        <pre id="log-box" class="log-box">Loading...</pre>
      </section>

      <section class="panel">
        <h2>Stored Records</h2>
        <table>
          <thead>
            <tr>
              <th>Doctor</th>
              <th>Service</th>
              <th>Amount</th>
              <th>Category</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <tr><td colspan="4">Loading...</td></tr>
          </tbody>
        </table>
      </section>
            <section class="panel">
        <h2>Reconciliation Pipeline</h2>
        <form id="pipeline-form" class="form">
          <label>Abronal folder <input id="abrDir" type="text" required /></label>
          <label>SoT folder <input id="sotDir" type="text" required /></label>
          <label>Date label <input id="dateLabel" type="text" placeholder="July 20 to July 22" /></label>
          <button id="pipeline-btn" type="submit">Run Pipeline</button>
        </form>
        <p id="pipeline-status" class="status"></p>
        <table>
          <thead><tr id="pipeline-head"></tr></thead>
          <tbody id="pipeline-body"><tr><td>No run yet.</td></tr></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
