<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Mode</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}
    .banner{background:#ffeedd;border:2px solid #ffcc99;padding:12px;margin-bottom:12px}
    .danger{background:#ffeeee;border:1px solid #ff9999;padding:8px;margin:8px 0}
    button{margin:4px}
    pre{background:#f6f8fa;padding:10px;border:1px solid #ddd}
  </style>
</head>
<body>
  <div class="banner">
    <strong>TEST MODE</strong> — interactive toolkit for dev/testing. Use only on test DBs.
    <div id="dbpath" style="margin-top:6px;color:#555"></div>
  </div>

  <section>
    <h3>Datasets</h3>
    <div id="datasets"></div>
    <div style="margin-top:8px">
      <h4>Upload dataset</h4>
      <input id="uploadName" placeholder="dataset name (no spaces)" />
      <input id="uploadFile" type="file" />
      <button id="uploadBtn">Upload</button>
    </div>
    <div style="margin-top:8px">
      <h4>Generate dataset</h4>
      <input id="genScenario" placeholder="scenario (e.g. 1.1)" />
      <button id="genBtn">Generate</button>
    </div>
    <div style="margin-top:8px">
      <h4>Upload CSV for a table</h4>
      <input id="csvName" placeholder="dataset name (no spaces)" />
      <select id="csvTable">
        <option value="abronal_mirror">abronal_mirror</option>
        <option value="sot_mirror">sot_mirror</option>
        <option value="matched_records">matched_records</option>
        <option value="unmatched_records">unmatched_records</option>
        <option value="service_prices">service_prices</option>
        <option value="physicians">physicians</option>
      </select>
      <input id="csvFile" type="file" accept=".csv" />
      <button id="csvUploadBtn">Upload CSV</button>
      <button id="csvImportBtn">Import CSV dataset into DB</button>
    </div>
  </section>

  <section>
    <h3>Actions</h3>
    <button id="refresh">Refresh status</button>
    <button id="resetDb">Reset DB schema</button>
    <button id="metrics">Show metrics</button>
  </section>

  <section>
    <h3>Tables</h3>
    <div id="tables"></div>
  </section>

  <h3>Output</h3>
  <pre id="out">Ready.</pre>

  <script>
    async function api(path, opts){
      const r = await fetch('/api/testmode'+path, opts);
      if(!r.ok){ const t=await r.text(); throw new Error(t||r.status); }
      return r.json();
    }

    async function refresh(){
      try{
        const s = await api('/status');
        document.getElementById('dbpath').textContent = 'DB: '+s.db_path + (s.active? ' (testmode active)':' (not testmode)');
        const ds = s.data_test_folders||[];
        const el = document.getElementById('datasets');
        el.innerHTML = '';
        ds.forEach(d=>{
          const b = document.createElement('button'); b.textContent = 'Load '+d;
          b.onclick = async ()=>{ if(!confirm('Load dataset '+d+'? This will overwrite current DB.')) return; const res=await api('/load_dataset',{method:'POST',headers:{'content-type':'application/json'}, body: JSON.stringify({folder:d})}); out(JSON.stringify(res, null, 2)); refreshTables(); };
          el.appendChild(b);
        });
      }catch(e){ out('Error: '+e); }
    }

    document.getElementById('uploadBtn').onclick = async ()=>{
      const name = document.getElementById('uploadName').value.trim();
      const fileInput = document.getElementById('uploadFile');
      if(!name){ alert('Provide dataset name'); return; }
      if(!fileInput.files.length){ alert('Select file'); return; }
      const f = fileInput.files[0];
      const fd = new FormData();
      fd.append('name', name);
      fd.append('file', f);
      try{
        const r = await fetch('/api/testmode/upload_dataset', {method:'POST', body: fd});
        const j = await r.json(); if(!r.ok){ out('Upload failed: '+JSON.stringify(j)); return; }
        out(JSON.stringify(j,null,2)); refresh(); refreshTables();
      }catch(e){ out('Error: '+e); }
    };

    document.getElementById('genBtn').onclick = async ()=>{
      const s = document.getElementById('genScenario').value.trim(); if(!s){ alert('Provide scenario like 1.1'); return; }
      try{
        const res = await api('/generate',{method:'POST',headers:{'content-type':'application/json'}, body: JSON.stringify({scenario:s})});
        out(JSON.stringify(res,null,2)); refresh(); refreshTables();
      }catch(e){ out('Error: '+e); }
    };

    document.getElementById('csvUploadBtn').onclick = async ()=>{
      const name = document.getElementById('csvName').value.trim();
      const table = document.getElementById('csvTable').value;
      const fileInput = document.getElementById('csvFile');
      if(!name){ alert('Provide dataset name'); return; }
      if(!fileInput.files.length){ alert('Select CSV file'); return; }
      const f = fileInput.files[0];
      const fd = new FormData();
      fd.append('name', name);
      fd.append('table', table);
      fd.append('file', f);
      try{
        const r = await fetch('/api/testmode/upload_csv', {method:'POST', body: fd});
        const j = await r.json(); if(!r.ok){ out('CSV upload failed: '+JSON.stringify(j)); return; }
        out(JSON.stringify(j,null,2)); refresh(); refreshTables();
      }catch(e){ out('Error: '+e); }
    };

    document.getElementById('csvImportBtn').onclick = async ()=>{
      const name = document.getElementById('csvName').value.trim();
      if(!name){ alert('Provide dataset name'); return; }
      if(!confirm('Import CSV dataset '+name+' into active DB (this may clear tables)?')) return;
      try{
        const res = await api('/import_csv_dataset',{method:'POST',headers:{'content-type':'application/json'}, body: JSON.stringify({name:name, clear_first:true})});
        out(JSON.stringify(res,null,2)); refreshTables();
      }catch(e){ out('Error: '+e); }
    };

    async function resetDb(){ if(!confirm('Reset DB schema?')) return; try{ const r=await api('/reset_db',{method:'POST'}); out(JSON.stringify(r,null,2)); refreshTables(); }catch(e){ out('Error: '+e); } }

    async function showMetrics(){ try{ const r=await api('/metrics'); out(JSON.stringify(r,null,2)); }catch(e){ out('Error: '+e); } }

    async function refreshTables(){ try{ const r=await api('/tables'); const el=document.getElementById('tables'); el.innerHTML=''; r.tables.forEach(t=>{ const d=document.createElement('div'); d.innerHTML = `<strong>${t.name}</strong> — ${t.count} rows <button data-table="${t.name}">Clear</button>`; el.appendChild(d); d.querySelector('button').onclick = async ()=>{ if(!confirm('Clear table '+t.name+'?')) return; await api('/clear_table',{method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({table:t.name})}); out('Cleared '+t.name); refreshTables(); }; }); }catch(e){ out('Error: '+e); } }

    function out(s){ document.getElementById('out').textContent = typeof s==='string'? s : JSON.stringify(s,null,2); }

    document.getElementById('refresh').onclick = refresh;
    document.getElementById('resetDb').onclick = resetDb;
    document.getElementById('metrics').onclick = showMetrics;

    // wire fetch body parsing for endpoints expecting JSON body params
    // small shim: when calling fetch with JSON body, our router expects form params - instead we read JSON in backend

    // initial load
    refresh(); refreshTables();
  </script>
</body>
</html>
